# 将此文件内容复制为 .github/workflows/daily-update.yml 即可启用每日自动更新
# （当前推送凭证无 workflow 写权限，需经 GitHub 网页端 Add file 或本地 git push 添加一次）

name: daily-update

on:
  schedule:
    # 每日 10:00 北京时间 = 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install

      - name: Capture new deals (Kimi + web search)
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MOONSHOT_BASE_URL: ${{ vars.MOONSHOT_BASE_URL }}
          MOONSHOT_MODEL: ${{ vars.MOONSHOT_MODEL }}
        run: node scripts/daily-update.mjs

      - name: Build gate（数据变更必须能通过构建）
        run: npm run build

      - name: Commit data update
        run: |
          git config user.name "billboard-bot"
          git config user.email "billboard-bot@users.noreply.github.com"
          git add src/lib/deals.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: daily update $(date +%F)"
            git push
          fi

      - name: Deploy to Cloudflare Pages（触发 Pages 拉取 main 重建部署）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "未配置 CF secrets，跳过部署"; exit 0; fi
          curl -sf -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/primary-market-billboard/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"branch":"main"}' && echo "deploy triggered"
